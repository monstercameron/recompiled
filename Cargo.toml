[package]
name = "recompiled"
version = "0.1.0"
edition = "2021"
description = "A source-linked catalog of game decompilations, recompilations, ports, API translations, localizations, and emulators"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "CssStyleDeclaration", "Document", "DomTokenList", "Element", "Event", "EventTarget", "HtmlInputElement",
  "HtmlSelectElement", "HtmlElement", "HtmlDialogElement", "HtmlVideoElement", "KeyboardEvent", "History", "Location", "UrlSearchParams", "Storage", "MediaQueryList", "NodeList", "Response", "Window", "console"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
